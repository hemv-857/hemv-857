name: Hire Exchange

on:
  schedule:
    - cron: "35 18 * * *"   # 18:35 UTC = 00:05 IST, right after the IST day ends
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: hire-exchange
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Settle yesterday, predict today
        env:
          # Optional: add a PAT as repo secret GH_PAT to count private-repo work.
          # Falls back to the built-in token (public activity only).
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python scripts/hire_exchange.py

      - name: Commit changes
        run: |
          # Bot identity on purpose: these commits must NOT count toward your own
          # commit total, otherwise the bot would be trading against itself.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json README.md assets/ticker.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(exchange): market update $(date -u +%F)"
            git push
          fi
